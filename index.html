<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HARSHA - Cyber Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>




<div class="calculator">


    <!-- HEADER -->

    <div class="header">

        <div class="brand">

            <div class="logo">
                +
            </div>

            <div>

                <h1>HARSHA</h1>

                <p>Calculator</p>

            </div>

        </div>


        <div class="live">

            <span class="live-dot"></span>

            ONLINE

        </div>

    </div>


    

    <div class="display">

        <div class="display-top">

            <span>
                Calculation
            </span>

            <span>
                01
            </span>

        </div>


        <div
            class="expression"
            id="expression">
        </div>


        <div
            class="result"
            id="result">
            0
        </div>

    </div>




    <div class="keypad">


        

        <button
            class="utility"
            onclick="clearAll()">
            AC
        </button>


        <button
            class="utility"
            onclick="deleteNumber()">
            DEL
        </button>


        <button
            class="utility"
            onclick="percentage()">
            %
        </button>


        <button
            class="operator"
            onclick="setOperation('÷')">
            ÷
        </button>


        

        <button
            class="number"
            onclick="inputNumber('7')">
            7
        </button>


        <button
            class="number"
            onclick="inputNumber('8')">
            8
        </button>


        <button
            class="number"
            onclick="inputNumber('9')">
            9
        </button>


        <button
            class="operator"
            onclick="setOperation('×')">
            ×
        </button>


        

        <button
            class="number"
            onclick="inputNumber('4')">
            4
        </button>


        <button
            class="number"
            onclick="inputNumber('5')">
            5
        </button>


        <button
            class="number"
            onclick="inputNumber('6')">
            6
        </button>


        <button
            class="operator"
            onclick="setOperation('-')">
            −
        </button>


        <!-- ROW 4 -->

        <button
            class="number"
            onclick="inputNumber('1')">
            1
        </button>


        <button
            class="number"
            onclick="inputNumber('2')">
            2
        </button>


        <button
            class="number"
            onclick="inputNumber('3')">
            3
        </button>


        <button
            class="operator"
            onclick="setOperation('+')">
            +
        </button>


        <!-- ROW 5 -->

        <button
            class="number zero"
            onclick="inputNumber('0')">
            0
        </button>


        <button
            class="number"
            onclick="inputNumber('.')">
            .
        </button>


        <button
            class="equals"
            onclick="calculate()">
            =
        </button>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        <span>
            HARSHA SYSTEM
        </span>

        <span>
            v1.0
        </span>

    </div>


</div>




    <script src="script.js"></script>


</body>
</html>
