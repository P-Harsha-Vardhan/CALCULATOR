<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HARSHA - Cyber Calculator</title>

<style>

/* =========================
   GOOGLE FONT
========================= */

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');


/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   VARIABLES
========================= */

:root {
    --cyan: #00eaff;
    --purple: #9b5cff;
    --pink: #ff3cac;

    --dark: #080912;
    --panel: #0d101c;

    --text: #edf7ff;
    --muted: #687184;
}


/* =========================
   BODY
========================= */

body {

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: "Space Grotesk", sans-serif;

    color: var(--text);

    background:

        radial-gradient(
            circle at 20% 20%,
            rgba(0, 234, 255, 0.12),
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(155, 92, 255, 0.15),
            transparent 35%
        ),

        #05060b;

    overflow: hidden;
}


/* =========================
   GRID BACKGROUND
========================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(0, 234, 255, 0.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0, 234, 255, 0.025) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    mask-image: linear-gradient(
        to bottom,
        transparent,
        black 25%,
        black 75%,
        transparent
    );

    pointer-events: none;
}


/* =========================
   CALCULATOR
========================= */

.calculator {

    position: relative;

    width: 410px;

    padding: 20px;

    border-radius: 26px;

    background:

        linear-gradient(
            145deg,
            rgba(20, 24, 40, 0.96),
            rgba(7, 9, 16, 0.98)
        );

    border: 1px solid rgba(255, 255, 255, 0.08);

    box-shadow:

        0 35px 100px rgba(0, 0, 0, 0.65),

        0 0 60px rgba(0, 234, 255, 0.04);

    z-index: 1;
}


/* =========================
   NEON BORDER
========================= */

.calculator::before {

    content: "";

    position: absolute;

    inset: -1px;

    border-radius: 27px;

    border: 1px solid transparent;

    background:

        linear-gradient(
            135deg,
            rgba(0, 234, 255, 0.7),
            transparent 35%,
            transparent 65%,
            rgba(255, 60, 172, 0.6)
        ) border-box;

    pointer-events: none;
}


/* =========================
   HEADER
========================= */

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 18px;
}


.brand {

    display: flex;

    align-items: center;

    gap: 11px;
}


.logo {

    width: 38px;

    height: 38px;

    display: flex;

    justify-content: center;

    align-items: center;

    border-radius: 10px;

    font-size: 17px;

    font-weight: 700;

    color: #041015;

    background: var(--cyan);

    box-shadow:
        0 0 20px rgba(0, 234, 255, 0.45);
}


.brand h1 {

    font-size: 15px;

    letter-spacing: 1px;
}


.brand p {

    margin-top: 2px;

    font-size: 9px;

    color: var(--muted);

    letter-spacing: 2px;

    text-transform: uppercase;
}


/* =========================
   ONLINE STATUS
========================= */

.live {

    display: flex;

    align-items: center;

    gap: 7px;

    padding: 7px 10px;

    border-radius: 20px;

    color: #7cf7d1;

    background: rgba(0, 255, 180, 0.05);

    border: 1px solid rgba(0, 255, 180, 0.1);

    font-size: 8px;

    letter-spacing: 1px;
}


.live-dot {

    width: 6px;

    height: 6px;

    border-radius: 50%;

    background: #4dffb5;

    box-shadow: 0 0 10px #4dffb5;

    animation: blink 1.5s infinite;
}


@keyframes blink {

    50% {
        opacity: 0.3;
    }

}


/* =========================
   DISPLAY
========================= */

.display {

    position: relative;

    height: 145px;

    padding: 20px;

    margin-bottom: 17px;

    border-radius: 18px;

    background:

        linear-gradient(
            145deg,
            #080b14,
            #05060b
        );

    border: 1px solid rgba(0, 234, 255, 0.1);

    overflow: hidden;
}


.display::before {

    content: "";

    position: absolute;

    width: 180px;

    height: 180px;

    right: -80px;

    top: -100px;

    background: var(--cyan);

    filter: blur(100px);

    opacity: 0.07;
}


.display-top {

    display: flex;

    justify-content: space-between;

    color: #41495b;

    font-size: 8px;

    letter-spacing: 2px;

    text-transform: uppercase;
}


.expression {

    margin-top: 24px;

    height: 20px;

    text-align: right;

    color: #596274;

    font-size: 13px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}


.result {

    margin-top: 2px;

    text-align: right;

    color: #f3fbff;

    font-size: 42px;

    font-weight: 600;

    letter-spacing: -1px;

    text-shadow:
        0 0 15px rgba(0, 234, 255, 0.25);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================
   KEYPAD
========================= */

.keypad {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 9px;
}


/* =========================
   BUTTONS
========================= */

button {

    height: 61px;

    border: none;

    outline: none;

    border-radius: 13px;

    background: #111522;

    color: #c8d1df;

    border: 1px solid rgba(255, 255, 255, 0.045);

    font-family: inherit;

    font-size: 17px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.15s ease;
}


button:hover {

    transform: translateY(-2px);

    color: white;

    background: #151a29;

    border-color:
        rgba(0, 234, 255, 0.25);

    box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.3);
}


button:active {

    transform: scale(0.91);
}


/* =========================
   NUMBER BUTTONS
========================= */

.number {

    color: #dce3ee;
}


/* =========================
   UTILITY BUTTONS
========================= */

.utility {

    color: #ff70ca;

    background:
        rgba(255, 60, 172, 0.07);

    border-color:
        rgba(255, 60, 172, 0.12);
}


.utility:hover {

    color: #ff8fd7;

    border-color:
        rgba(255, 60, 172, 0.35);

    box-shadow:
        0 0 18px rgba(255, 60, 172, 0.1);
}


/* =========================
   OPERATOR BUTTONS
========================= */

.operator {

    color: var(--cyan);

    background:
        rgba(0, 234, 255, 0.06);

    border-color:
        rgba(0, 234, 255, 0.12);
}


.operator:hover {

    border-color: var(--cyan);

    box-shadow:
        0 0 18px rgba(0, 234, 255, 0.12);
}


/* =========================
   EQUAL BUTTON
========================= */

.equals {

    color: #070b10;

    background:

        linear-gradient(
            135deg,
            var(--cyan),
            #62f4ff
        );

    border: none;

    box-shadow:
        0 0 20px rgba(0, 234, 255, 0.18);
}


.equals:hover {

    color: #05080c;

    background:

        linear-gradient(
            135deg,
            #36efff,
            #8af8ff
        );

    box-shadow:
        0 0 30px rgba(0, 234, 255, 0.35);
}


/* =========================
   ZERO BUTTON
========================= */

.zero {

    grid-column: span 2;
}


/* =========================
   FOOTER
========================= */

.footer {

    display: flex;

    justify-content: space-between;

    margin-top: 15px;

    padding: 0 4px;

    color: #3d4555;

    font-size: 8px;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}


.footer span:last-child {

    color: #526071;
}


/* =========================
   MOBILE RESPONSIVE
========================= */

@media (max-width: 450px) {

    .calculator {

        width: calc(100% - 22px);

        padding: 16px;
    }


    .display {

        height: 130px;
    }


    .result {

        font-size: 35px;
    }


    button {

        height: 56px;

        font-size: 15px;
    }


    .brand p {

        display: none;
    }

}

</style>
</head>


<body>


<!-- =========================
     CALCULATOR
========================= -->

<div class="calculator">


    <!-- HEADER -->

    <div class="header">

        <div class="brand">

            <div class="logo">
                +
            </div>

            <div>

                <h1>HARSHA</h1>

                <p>Calculator</p>

            </div>

        </div>


        <div class="live">

            <span class="live-dot"></span>

            ONLINE

        </div>

    </div>


    <!-- DISPLAY -->

    <div class="display">

        <div class="display-top">

            <span>
                Calculation
            </span>

            <span>
                01
            </span>

        </div>


        <div
            class="expression"
            id="expression">
        </div>


        <div
            class="result"
            id="result">
            0
        </div>

    </div>


    <!-- KEYPAD -->

    <div class="keypad">


        <!-- ROW 1 -->

        <button
            class="utility"
            onclick="clearAll()">
            AC
        </button>


        <button
            class="utility"
            onclick="deleteNumber()">
            DEL
        </button>


        <button
            class="utility"
            onclick="percentage()">
            %
        </button>


        <button
            class="operator"
            onclick="setOperation('÷')">
            ÷
        </button>


        <!-- ROW 2 -->

        <button
            class="number"
            onclick="inputNumber('7')">
            7
        </button>


        <button
            class="number"
            onclick="inputNumber('8')">
            8
        </button>


        <button
            class="number"
            onclick="inputNumber('9')">
            9
        </button>


        <button
            class="operator"
            onclick="setOperation('×')">
            ×
        </button>


        <!-- ROW 3 -->

        <button
            class="number"
            onclick="inputNumber('4')">
            4
        </button>


        <button
            class="number"
            onclick="inputNumber('5')">
            5
        </button>


        <button
            class="number"
            onclick="inputNumber('6')">
            6
        </button>


        <button
            class="operator"
            onclick="setOperation('-')">
            −
        </button>


        <!-- ROW 4 -->

        <button
            class="number"
            onclick="inputNumber('1')">
            1
        </button>


        <button
            class="number"
            onclick="inputNumber('2')">
            2
        </button>


        <button
            class="number"
            onclick="inputNumber('3')">
            3
        </button>


        <button
            class="operator"
            onclick="setOperation('+')">
            +
        </button>


        <!-- ROW 5 -->

        <button
            class="number zero"
            onclick="inputNumber('0')">
            0
        </button>


        <button
            class="number"
            onclick="inputNumber('.')">
            .
        </button>


        <button
            class="equals"
            onclick="calculate()">
            =
        </button>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        <span>
            HARSHA SYSTEM
        </span>

        <span>
            v1.0
        </span>

    </div>


</div>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/* =========================
   VARIABLES
========================= */

let currentNumber = "";

let previousNumber = "";

let operation = null;

let shouldResetScreen = false;


/* =========================
   ELEMENTS
========================= */

const result =
    document.getElementById("result");

const expression =
    document.getElementById("expression");


/* =========================
   UPDATE DISPLAY
========================= */

function updateDisplay() {

    result.textContent =
        currentNumber || "0";

}


/* =========================
   INPUT NUMBER
========================= */

function inputNumber(number) {


    /*
       If we just calculated
       something, start a new number.
    */

    if (shouldResetScreen) {

        currentNumber = "";

        shouldResetScreen = false;
    }


    /*
       Prevent multiple decimal points.
    */

    if (
        number === "." &&
        currentNumber.includes(".")
    ) {

        return;
    }


    /*
       Prevent unnecessary leading zeros.
    */

    if (
        currentNumber === "0" &&
        number !== "."
    ) {

        currentNumber = number;

    } else {

        currentNumber += number;

    }


    updateDisplay();

}


/* =========================
   SET OPERATION
========================= */

function setOperation(operator) {


    /*
       Nothing entered yet.
    */

    if (
        currentNumber === "" &&
        previousNumber === ""
    ) {

        return;
    }


    /*
       If there is already
       an operation, calculate first.
    */

    if (
        currentNumber !== "" &&
        previousNumber !== ""
    ) {

        calculate();
    }


    if (currentNumber !== "") {

        previousNumber =
            currentNumber;

    }


    operation = operator;


    expression.textContent =
        `${previousNumber} ${operation}`;


    shouldResetScreen = true;

}


/* =========================
   CALCULATE
========================= */

function calculate() {


    if (
        previousNumber === "" ||
        currentNumber === "" ||
        operation === null
    ) {

        return;
    }


    const previous =
        parseFloat(previousNumber);


    const current =
        parseFloat(currentNumber);


    let answer;


    switch (operation) {


        case "+":

            answer =
                previous + current;

            break;


        case "-":

            answer =
                previous - current;

            break;


        case "×":

            answer =
                previous * current;

            break;


        case "÷":


            if (current === 0) {

                result.textContent =
                    "ERROR";

                expression.textContent =
                    "Cannot divide by zero";


                currentNumber = "";

                previousNumber = "";

                operation = null;

                return;
            }


            answer =
                previous / current;

            break;

    }


    /*
       Reduce floating point errors.
    */

    answer =
        parseFloat(
            answer.toFixed(10)
        );


    expression.textContent =
        `${previousNumber} ${operation} ${currentNumber} =`;


    currentNumber =
        answer.toString();


    previousNumber = "";

    operation = null;

    shouldResetScreen = true;


    updateDisplay();

}


/* =========================
   CLEAR ALL
========================= */

function clearAll() {


    currentNumber = "";

    previousNumber = "";

    operation = null;

    shouldResetScreen = false;


    expression.textContent = "";

    result.textContent = "0";

}


/* =========================
   DELETE NUMBER
========================= */

function deleteNumber() {


    if (shouldResetScreen) {

        return;
    }


    currentNumber =
        currentNumber.slice(0, -1);


    updateDisplay();

}


/* =========================
   PERCENTAGE
========================= */

function percentage() {


    if (currentNumber === "") {

        return;
    }


    const number =
        parseFloat(currentNumber);


    currentNumber =
        (number / 100).toString();


    updateDisplay();

}


/* =========================
   KEYBOARD SUPPORT
========================= */

document.addEventListener(
    "keydown",
    function(event) {


        const key = event.key;


        /*
           Numbers
        */

        if (
            key >= "0" &&
            key <= "9"
        ) {

            inputNumber(key);

        }


        /*
           Decimal
        */

        else if (key === ".") {

            inputNumber(".");

        }


        /*
           Addition
        */

        else if (key === "+") {

            setOperation("+");

        }


        /*
           Subtraction
        */

        else if (key === "-") {

            setOperation("-");

        }


        /*
           Multiplication
        */

        else if (key === "*") {

            setOperation("×");

        }


        /*
           Division
        */

        else if (key === "/") {

            event.preventDefault();

            setOperation("÷");

        }


        /*
           Enter / Equal
        */

        else if (
            key === "Enter" ||
            key === "="
        ) {

            calculate();

        }


        /*
           Backspace
        */

        else if (key === "Backspace") {

            deleteNumber();

        }


        /*
           Escape
        */

        else if (key === "Escape") {

            clearAll();

        }


        /*
           Percentage
        */

        else if (key === "%") {

            percentage();

        }

    }
);

</script>


</body>
</html>
